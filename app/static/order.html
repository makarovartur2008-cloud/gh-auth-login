<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Картошка с доставкой</title>
  <style>
    :root { --bg: #f6f3ec; --card: #fff; --text: #1d1d1b; --hint: #77736a; --green: #2e7d32; --green2: #e7f2e3; --red: #c62828; --line: #e6e1d6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151714; --card: #1f221e; --text: #ecebe6; --hint: #9a978f; --green: #5cb860; --green2: #22301f; --line: #30342d; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    main { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
    h1 { font-size: 26px; margin: 8px 0 4px; line-height: 1.15; }
    h2 { font-size: 18px; margin: 22px 0 8px; }
    .sub { color: var(--hint); margin: 0 0 8px; }
    .card { background: var(--card); border-radius: 14px; padding: 12px 14px; margin: 8px 0; }
    .prod { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .prod:last-child { border-bottom: 0; }
    .prod .info { flex: 1; min-width: 0; }
    .prod .name { font-weight: 600; }
    .prod .price { color: var(--hint); font-size: 14px; }
    .step { display: flex; align-items: center; gap: 4px; }
    .step button { width: 38px; height: 38px; border-radius: 19px; border: 0; background: var(--green2); color: var(--green); font-size: 22px; line-height: 1; cursor: pointer; }
    .step span { min-width: 64px; text-align: center; font-weight: 600; font-size: 15px; }
    .step span.zero { color: var(--hint); font-weight: 400; }
    .days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
    .days::-webkit-scrollbar { display: none; }
    .days button { flex: 0 0 auto; border: 1.5px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; }
    .days button.on { border-color: var(--green); background: var(--green2); color: var(--green); font-weight: 600; }
    label { display: block; font-size: 13px; color: var(--hint); margin: 10px 0 4px; }
    input, textarea { width: 100%; font: inherit; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--text); }
    input:focus, textarea:focus { outline: none; border-color: var(--green); }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .hp { position: absolute; left: -9999px; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
    .bar div { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .bar .sum { flex: 1; } .bar .sum b { font-size: 20px; display: block; }
    .bar button { border: 0; border-radius: 14px; background: var(--green); color: #fff; font: inherit; font-weight: 700; padding: 14px 22px; cursor: pointer; }
    .bar button:disabled { opacity: .5; }
    .err { color: var(--red); font-size: 14px; margin-top: 8px; }
    .done { text-align: center; padding-top: 60px; }
    .done .big { font-size: 64px; }
    .phone a { color: var(--green); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
<main id="app">
  <h1>🥔 Картошка и овощи<br>с доставкой на дом</h1>
  <p class="sub">Выберите товары и день — мы позвоним, чтобы подтвердить заказ.</p>
  <p class="sub phone" id="phone"></p>

  <h2>1. Что привезти</h2>
  <div class="card" id="products">Загрузка…</div>

  <h2>2. Когда привезти</h2>
  <div class="days" id="days"></div>

  <h2>3. Куда и кому</h2>
  <div class="card">
    <label for="name">Ваше имя</label><input id="name" autocomplete="name">
    <label for="tel">Телефон</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 ___ ___-__-__">
    <label for="address">Адрес (улица, дом)</label><input id="address" autocomplete="street-address">
    <div class="row3">
      <div><label for="entrance">Подъезд</label><input id="entrance" inputmode="numeric"></div>
      <div><label for="floor">Этаж</label><input id="floor" inputmode="numeric"></div>
      <div><label for="apartment">Кв.</label><input id="apartment" inputmode="numeric"></div>
    </div>
    <label for="comment">Комментарий (необязательно)</label><textarea id="comment" rows="2" placeholder="Например: позвонить за 30 минут"></textarea>
    <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  </div>
  <p class="sub">Оплата при получении: наличными или переводом.</p>
  <div class="err" id="err"></div>
</main>
<div class="bar"><div><div class="sum"><span class="sub">Итого</span><b id="total">0 ₽</b></div><button id="send" disabled>Заказать</button></div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const source = new URLSearchParams(location.search).get("s") || "";
const qty = {}; // product_id -> количество
let info, day;
const money = (v) => Math.round(v).toLocaleString("ru-RU") + " ₽";
const fmt = (q) => (Number.isInteger(q) ? q : +q.toFixed(1)).toString();

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (!Number.isInteger(n)) return few;
  if (a > 10 && a < 20) return many;
  return b === 1 ? one : b >= 2 && b <= 4 ? few : many;
}

// шаг и минимум: картошка — сетками, мёд — банками, остальное — по 1 кг
function stepOf(p) { return p.min_qty ? info.sack_kg : 1; }
function minOf(p) { return p.min_qty || stepOf(p); }
function label(p, q) {
  if (!q) return "—";
  if (p.min_qty) return `${fmt(q / info.sack_kg)} ${plural(q / info.sack_kg, "сетка", "сетки", "сеток")} · ${fmt(q)} кг`;
  return p.unit === "кг" ? `${fmt(q)} кг` : `${fmt(q)} шт`;
}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k.startsWith("on") ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  e.append(...kids);
  return e;
}

function renderProducts() {
  $("products").replaceChildren(...info.products.map((p) => {
    const q = qty[p.id] || 0;
    const unit = p.unit === "кг" ? "кг" : "банка";
    const change = (dir) => {
      const cur = qty[p.id] || 0;
      let next = cur + dir * stepOf(p);
      if (dir > 0 && cur === 0) next = minOf(p);
      if (dir < 0 && next < minOf(p)) next = 0;
      qty[p.id] = next;
      renderProducts();
    };
    return el("div", { class: "prod" },
      el("div", { class: "info" }, el("div", { class: "name" }, `${p.emoji} ${p.name}`),
        el("div", { class: "price" }, `${fmt(p.price)} ₽/${unit}` + (p.min_qty ? ` · от ${fmt(p.min_qty)} кг (сетка ${info.sack_kg} кг)` : ""))),
      el("div", { class: "step" },
        el("button", { type: "button", "aria-label": "меньше", onclick: () => change(-1) }, "−"),
        el("span", { class: q ? "" : "zero" }, label(p, q)),
        el("button", { type: "button", "aria-label": "больше", onclick: () => change(1) }, "+")));
  }));
  const total = info.products.reduce((a, p) => a + (qty[p.id] || 0) * p.price, 0);
  $("total").textContent = money(total);
  $("send").disabled = total <= 0;
}

function renderDays() {
  $("days").replaceChildren(...info.days.map((d) =>
    el("button", { type: "button", class: d.date === day ? "on" : "", onclick: () => { day = d.date; renderDays(); } }, d.label)));
}

async function send() {
  $("err").textContent = "";
  const body = {
    name: $("name").value.trim(), phone: $("tel").value.trim(), address: $("address").value.trim(),
    entrance: $("entrance").value.trim(), floor: $("floor").value.trim(), apartment: $("apartment").value.trim(),
    comment: $("comment").value.trim(), website: $("website").value, date: day, source,
    items: Object.entries(qty).filter(([, q]) => q > 0).map(([id, q]) => ({ product_id: +id, qty: q })),
  };
  if (!body.name) return showErr("Укажите имя", "name");
  if (body.phone.replace(/\D/g, "").length < 10) return showErr("Укажите телефон, чтобы мы могли позвонить", "tel");
  if (body.address.length < 3) return showErr("Укажите адрес", "address");
  $("send").disabled = true;
  try {
    const res = await fetch("/api/public/order", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Не получилось отправить. Проверьте поля.");
    try { localStorage.setItem("kartoshka-client", JSON.stringify({ name: body.name, phone: body.phone, address: body.address, entrance: body.entrance, floor: body.floor, apartment: body.apartment })); } catch (_) {}
    const dayLabel = info.days.find((d) => d.date === day)?.label || day;
    document.querySelector(".bar").remove();
    $("app").replaceChildren(el("div", { class: "done" },
      el("div", { class: "big" }, "✅"), el("h1", {}, "Заказ принят!"),
      el("p", {}, `Доставка: ${dayLabel}. Сумма: ${money(data.total || 0)}.`),
      el("p", { class: "sub" }, "Мы позвоним, чтобы подтвердить время. Спасибо!"),
      info.phone ? el("p", { class: "phone" }, "Вопросы: ", el("a", { href: "tel:" + info.phone.replace(/[^\d+]/g, "") }, info.phone)) : ""));
    window.scrollTo(0, 0);
  } catch (e) {
    showErr(e.message);
    $("send").disabled = false;
  }
}

function showErr(text, focusId) {
  $("err").textContent = "⚠️ " + text;
  if (focusId) $(focusId).focus();
  $("err").scrollIntoView({ block: "center", behavior: "smooth" });
}

(async function init() {
  try {
    info = await (await fetch("/api/public/info")).json();
  } catch (_) {
    $("products").textContent = "Не удалось загрузить. Обновите страницу.";
    return;
  }
  day = info.days[1]?.date || info.days[0].date; // по умолчанию — завтра
  if (info.phone) $("phone").replaceChildren("Или звоните: ", el("a", { href: "tel:" + info.phone.replace(/[^\d+]/g, "") }, info.phone));
  try {
    const saved = JSON.parse(localStorage.getItem("kartoshka-client") || "null");
    if (saved) for (const [k, v] of Object.entries({ name: saved.name, tel: saved.phone, address: saved.address, entrance: saved.entrance, floor: saved.floor, apartment: saved.apartment })) if (v) $(k).value = v;
  } catch (_) {}
  if (!info.products.length) $("products").textContent = "Сейчас нет товаров в продаже.";
  else renderProducts();
  renderDays();
  $("send").addEventListener("click", send);
})();
</script>
</body>
</html>
